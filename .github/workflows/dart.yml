name: Build Flutter APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'
        
    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.13.0'
        channel: 'stable'
        
    # Naya temporary project banayenge
    - name: Create Flutter Project
      run: flutter create --org com.vasim --project-name bill_book_app my_temp_app
      
    # Apna code copy karenge
    - name: Copy Files
      run: |
        cp pubspec.yaml my_temp_app/
        cp -r lib/* my_temp_app/lib/
        
    - name: Get dependencies
      working-directory: ./my_temp_app
      run: flutter pub get
      
    - name: Build APK
      working-directory: ./my_temp_app
      run: flutter build apk --debug
      
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Bill-Book-APK
        path: my_temp_app/build/app/outputs/flutter-apk/app-debug.apk
